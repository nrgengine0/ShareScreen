<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screen Share - Sender (Firebase)</title>
    <style>
        body { font-family: sans-serif; background-color: #1a1a1a; color: white; text-align: center; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        video { width: 100%; max-width: 600px; background: #000; border: 2px solid #333; margin-top: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <h2>Sender: Share Your Screen</h2>
    <button id="startBtn">Start Sharing</button>
    <br>
    <video id="localVideo" autoplay playsinline muted></video>

    <!-- Firebase WebRTC Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Your Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAtkK8QrsdAlT87VDZN4TNILGGYWyI5T6o",
            authDomain: "vor-solo.firebaseapp.com",
            databaseURL: "https://vor-solo-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vor-solo",
            storageBucket: "vor-solo.firebasestorage.app",
            messagingSenderId: "856896766437",
            appId: "1:856896766437:web:725247533147ee85e8ef0c",
            measurementId: "G-JHMRXYQLSV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Database references for a specific "room"
        const roomRef = ref(db, 'rooms/testRoom');
        const offerRef = ref(db, 'rooms/testRoom/offer');
        const answerRef = ref(db, 'rooms/testRoom/answer');
        const senderCandidatesRef = ref(db, 'rooms/testRoom/senderCandidates');
        const receiverCandidatesRef = ref(db, 'rooms/testRoom/receiverCandidates');

        const localVideo = document.getElementById('localVideo');
        const configuration = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        let peerConnection = new RTCPeerConnection(configuration);

        document.getElementById('startBtn').addEventListener('click', async () => {
            try {
                // Clear old database data before starting a new session
                await remove(roomRef);

                const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                localVideo.srcObject = stream;
                
                stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

                // Generate Offer
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                // Save Offer to Firebase
                await set(offerRef, { type: offer.type, sdp: offer.sdp });

                document.getElementById('startBtn').innerText = "Sharing...";
                document.getElementById('startBtn').disabled = true;

                // Listen for Answer from Receiver
                onValue(answerRef, async (snapshot) => {
                    const data = snapshot.val();
                    if (data && !peerConnection.currentRemoteDescription) {
                        const answer = new RTCSessionDescription(data);
                        await peerConnection.setRemoteDescription(answer);
                    }
                });

                // Listen for Receiver ICE candidates
                onChildAdded(receiverCandidatesRef, async (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(data));
                    }
                });

            } catch (err) {
                console.error("Error sharing screen:", err);
            }
        });

        // Push local ICE candidates to Firebase
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) {
                push(senderCandidatesRef, event.candidate.toJSON());
            }
        };
    </script>
</body>
</html>
