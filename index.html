<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOLO Stream - Persistent Screen Mirroring</title>
    <style>
        body { margin: 0; padding: 20px; background: #121212; color: #fff; font-family: sans-serif; text-align: center; }
        .btn { padding: 15px 30px; font-size: 16px; font-weight: bold; background: #00ffcc; border: none; border-radius: 8px; cursor: pointer; color: #000; box-shadow: 0 4px 15px rgba(0,255,204,0.3); margin: 5px; }
        #status { margin-top: 15px; color: #ffaa00; font-size: 15px; }
        
        .list-box { background: #1e1e1e; padding: 15px; border-radius: 12px; max-width: 400px; margin: 20px auto; border: 1px solid #333; text-align: left; }
        .list-title { font-weight: bold; color: #00ffcc; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
        
        .control-box { background: #1e1e1e; padding: 20px; border-radius: 12px; max-width: 400px; margin: 20px auto; text-align: left; border: 1px solid #333; }
        .control-group { margin-bottom: 15px; }
        .control-group label { display: block; margin-bottom: 5px; color: #00ffcc; font-weight: bold; }
        .control-group input, .control-group select { width: 100%; accent-color: #00ffcc; background: #2a2a2a; color: white; border: 1px solid #444; padding: 8px; border-radius: 6px; }
        
        .video-container { position: relative; max-width: 400px; margin: 20px auto; }
        video { width: 100%; border-radius: 12px; border: 3px solid #333; background: #000; }
    </style>
</head>
<body>

    <h1>🖥️ PERSISTENT SCREEN CONTROLLER</h1>
    <div>
        <button class="btn" id="startScreenBtn">🖥️ Screen Share စတင်မည်</button>
    </div>
    <div id="status">ခလုတ်ကို နှိပ်ပြီး Screen Sharing ခွင့်ပြုပေးပါ...</div>

    <div class="list-box">
        <div class="list-title">👥 ချိတ်ဆက်မှု အခြေအနေ</div>
        <div style="color:#00ffcc; text-align:center; font-size:14px;">StreamChamp Secure Direct Mode Active</div>
    </div>

    <!-- ⚙️ Screen Quality Settings Box -->
    <div class="control-box">
        <div class="list-title" style="border:none;">⚙️ SCREEN QUALITY SETTINGS</div>
        <div class="control-group">
            <label>အချိုးအစား (Aspect Ratio)</label>
            <select id="ratioSelect">
                <option value="16:9" selected>16:9 (Landscape / Gaming)</option>
                <option value="9:16">9:16 (Portrait / Phone UI)</option>
                <option value="1:1">1:1 (Square)</option>
            </select>
        </div>
        <div class="control-group">
            <label>ကြည်လင်ပြတ်သားမှု (Resolution)</label>
            <select id="resSelect">
                <option value="720p">720p (HD)</option>
                <option value="1080p" selected>1080p (Full HD)</option>
                <option value="1440p">1440p (2K Ultra)</option>
            </select>
        </div>
        <div class="control-group">
            <label>ဖရိမ်နှုန်း (Frame Rate)</label>
            <select id="fpsSelect">
                <option value="30">30 FPS</option>
                <option value="60" selected>60 FPS</option>
                <option value="90">90 FPS (Extreme Gaming)</option>
            </select>
        </div>
    </div>

    <!-- 📐 Layout Controls Box -->
    <div class="control-box">
        <div class="list-title" style="border:none;">📐 LAYOUT CONTROLS</div>
        <div class="control-group">
            <label>အပေါ် / အောက် (Top Position)</label>
            <input type="range" id="topSlider" min="0" max="900" value="30">
        </div>
        <div class="control-group">
            <label>ဘယ် / ညာ (Left Position)</label>
            <input type="range" id="leftSlider" min="0" max="1600" value="30">
        </div>
        <div class="control-group">
            <label>အရွယ်အစား (Screen Mirror Size)</label>
            <input type="range" id="sizeSlider" min="150" max="1200" value="400">
        </div>
    </div>

    <div class="video-container">
        <!-- Background မှာ Video မရပ်သွားစေရန် playsinline နှင့် autoplay ကို သေချာထည့်ထားသည် -->
        <video id="localScreenVideo" autoplay playsinline webkit-playsinline muted loops></video>
    </div>

    <!-- Background အလုပ်လုပ်စေရန် ကူညီမည့် Audio Element -->
    <audio id="bgKeepAliveAudio" loop muted playsinline></audio>

    <canvas id="captureCanvas" style="display:none;"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAtkK8QrsdAlT87VDZN4TNILGGYWyI5T6o",
            authDomain: "vor-solo.firebaseapp.com",
            databaseURL: "https://vor-solo-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "vor-solo",
            storageBucket: "vor-solo.firebasestorage.app",
            messagingSenderId: "856896766437",
            appId: "1:856896766437:web:3431fc6596d95aa0e8ef0c",
            measurementId: "G-0PYHWM5Y4P"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const layoutRef = ref(db, 'stream/layout');
        const imageRef = ref(db, 'stream/imageFrame');

        let screenStream;
        const localScreenVideo = document.getElementById('localScreenVideo');
        const bgAudio = document.getElementById('bgKeepAliveAudio');
        const canvas = document.getElementById('captureCanvas');
        const ctx = canvas.getContext('2d');
        let streamInterval;

        function sendLayoutUpdate() {
            set(layoutRef, {
                top: document.getElementById('topSlider').value + "px",
                left: document.getElementById('leftSlider').value + "px",
                width: document.getElementById('sizeSlider').value + "px",
                ratio: document.getElementById('ratioSelect').value
            });
        }

        document.getElementById('topSlider').addEventListener('input', sendLayoutUpdate);
        document.getElementById('leftSlider').addEventListener('input', sendLayoutUpdate);
        document.getElementById('sizeSlider').addEventListener('input', sendLayoutUpdate);
        document.getElementById('ratioSelect').addEventListener('change', sendLayoutUpdate);

        async function applyQualityChanges() {
            if (screenStream) {
                screenStream.getTracks().forEach(track => track.stop());
                clearInterval(streamInterval);
                await startScreenMirror();
            }
        }

        document.getElementById('resSelect').addEventListener('change', applyQualityChanges);
        document.getElementById('fpsSelect').addEventListener('change', applyQualityChanges);

        // Browser ကို Background တွင် မအိပ်သွားစေရန် ဖန်တီးပေးသည့် စနစ်
        function activateBackgroundMode() {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'SOLO Stream Engine',
                    artist: 'Active Background Mirroring',
                    album: 'Live Streaming Overlay'
                });
                
                // Media Control များကို ဖမ်းယူထားပြီး Browser Process ကို Alive ဖြစ်စေရန်လုပ်ခြင်း
                navigator.mediaSession.setActionHandler('play', () => {});
                navigator.mediaSession.setActionHandler('pause', () => {});
            }

            // Web Audio Context အသုံးပြုပြီး အသံတိတ် Wave တစ်ခုကို ဖန်တီးကာ Background တွင် Run ခိုင်းခြင်း
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.001; // နားမကြားနိုင်လောက်အောင် အသံတိုးထားခြင်း
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
            } catch (e) {
                console.log("Background Audio Context Init failed");
            }
        }

        window.startScreenMirror = async function() {
            document.getElementById('status').innerText = "Screen Share Permission တောင်းဆိုနေပါသည်...";
            
            const resMode = document.getElementById('resSelect').value;
            const fpsMode = parseInt(document.getElementById('fpsSelect').value);
            
            let targetWidth = 1920; let targetHeight = 1080;
            if (resMode === "720p") { targetWidth = 1280; targetHeight = 720; }
            else if (resMode === "1440p") { targetWidth = 2560; targetHeight = 1440; }

            try {
                screenStream = await navigator.mediaDevices.getDisplayMedia({
                    video: { width: { ideal: targetWidth }, height: { ideal: targetHeight }, frameRate: { ideal: fpsMode } },
                    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
                });
                
                localScreenVideo.srcObject = screenStream;
                document.getElementById('status').innerText = "🟢 Active! အပြင်ထွက်၍ ဂိမ်းဆော့နိုင်ပါပြီ။";
                
                // Background Mode စတင်နှိုးဆော်ခြင်း
                activateBackgroundMode();
                sendLayoutUpdate();

                canvas.width = targetWidth;
                canvas.height = targetHeight;
                
                const intervalMs = Math.round(1000 / fpsMode);
                streamInterval = setInterval(() => {
                    // Browser က Background ရောက်သွားသည့်တိုင် ရပ်မသွားစေဘဲ Canvas ပေါ် ဆက်ဆွဲခိုင်းခြင်း
                    if (localScreenVideo.readyState === localScreenVideo.HAVE_ENOUGH_DATA) {
                        ctx.drawImage(localScreenVideo, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.45); 
                        set(imageRef, dataUrl);
                    }
                }, intervalMs);

                screenStream.getVideoTracks()[0].onended = () => {
                    clearInterval(streamInterval);
                    document.getElementById('status').innerText = "🔴 Screen Share ကို ရပ်ဆိုင်းလိုက်ပါပြီ။";
                };

            } catch (err) {
                document.getElementById('status').innerText = "Error: " + err.message;
            }
        }
        
        document.getElementById('startScreenBtn').addEventListener('click', startScreenMirror);
    </script>
</body>
</html>
